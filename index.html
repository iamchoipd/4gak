<title>4학년 사각형 OX 도전</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#14213d;background:#f1f5f9}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px}
.app{width:min(100%,690px);background:#fff;border-radius:26px;box-shadow:0 18px 50px #1e293b16;padding:clamp(20px,5vw,36px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.eyebrow{font-size:13px;font-weight:800;color:#2563eb;letter-spacing:.04em}h1{font-size:clamp(25px,5vw,34px);margin:8px 0 13px}.sub{line-height:1.7;color:#475569;margin:0}.pill{padding:9px 12px;border-radius:50px;background:#e0ecff;color:#1d4ed8;font-weight:800;font-size:13px}
.rules{padding:17px;background:#f8fafc;border-radius:16px;margin:22px 0;line-height:1.9}.rules b{color:#1d4ed8}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:4px solid #93c5fd;outline-offset:3px}.start,.restart{width:100%;border-radius:16px;background:#2563eb;color:white;padding:18px;font-weight:800;font-size:19px}.start:hover,.restart:hover{background:#1d4ed8}
.hidden{display:none!important}.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:800}.danger{color:#be123c}.ok{color:#15803d}.muted{color:#64748b}.meter{height:13px;background:#e2e8f0;border-radius:50px;overflow:hidden;margin:12px 0 24px}.meter>div{height:100%;background:#2563eb;width:0;transition:width .25s}
.category{color:#64748b;font-size:14px;font-weight:700;text-align:center}.question{min-height:155px;display:grid;place-items:center;text-align:center;font-weight:850;font-size:clamp(23px,4.7vw,32px);line-height:1.5;word-break:keep-all;margin:10px 0 24px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:135px;border:3px solid transparent;border-radius:20px;color:white;font-weight:900;font-size:76px;transition:transform .12s,opacity .12s}.answer:active{transform:scale(.97)}.answer.o{background:#168455}.answer.x{background:#e34b56}.answer:disabled{cursor:default;opacity:.65}.answer.selected{opacity:1;outline:5px solid #fbbf24;outline-offset:2px}
.feedback{min-height:74px;text-align:center;margin:20px 0 8px;font-weight:800;font-size:19px;line-height:1.5}.feedback small{display:block;font-size:14px;color:#475569;font-weight:500;margin-top:6px}.foot{text-align:center;font-size:12px;color:#94a3b8;margin-top:18px}
.result-icon{font-size:67px;text-align:center}.result-title{text-align:center;font-size:30px;font-weight:900;margin:8px 0}.result-detail{text-align:center;line-height:1.75;color:#475569;margin:0 0 24px}.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.stat{background:#f1f5f9;border-radius:15px;padding:18px;text-align:center}.stat strong{display:block;font-size:30px;color:#1d4ed8}.stat span{font-size:13px;color:#475569}
@media(max-width:390px){body{padding:10px}.app{padding:18px}.answer{min-height:115px;font-size:65px}.question{min-height:175px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <section id="home">
    <div class="top"><span class="eyebrow">초등학교 4학년 수학</span><span class="pill">150문항 문제은행</span></div>
    <h1>🔷 사각형 OX 도전</h1>
    <p class="sub">사각형의 정의와 성질, 포함 관계를 OX 퀴즈로 익혀요.</p>
    <div class="rules">🎯 <b>20문항</b>을 끝까지 풀면 성공!<br>💛 도전 중 <b>한 번의 오답</b>은 괜찮아요.<br>💥 <b>두 번째 오답</b>이 나오면 도전 실패!<br>🔀 문제는 무작위로 나오며 같은 도전에서 반복되지 않아요.<br>⏳ 시간제한은 없어요.</div>
    <button class="start" id="startBtn">도전 시작하기</button>
  </section>
  <section id="game" class="hidden" aria-live="polite">
    <div class="status"><span id="progressText">1 / 20</span><span id="mistakeText">남은 실수 기회 💛 1</span></div>
    <div class="meter" role="progressbar" aria-label="문항 진행률" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" id="meter"><div id="meterFill"></div></div>
    <div class="category" id="category"></div>
    <div class="question" id="question"></div>
    <div class="answers"><button id="oBtn" class="answer o" aria-label="맞다 O">O</button><button id="xBtn" class="answer x" aria-label="아니다 X">X</button></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="foot">답을 고르면 잠시 후 다음 문제로 넘어가요.</div>
  </section>
  <section id="result" class="hidden" aria-live="polite">
    <div class="result-icon" id="resultIcon"></div><div class="result-title" id="resultTitle"></div><p class="result-detail" id="resultDetail"></p>
    <div class="result-stats"><div class="stat"><strong id="solvedStat">0</strong><span>푼 문제</span></div><div class="stat"><strong id="wrongStat">0</strong><span>틀린 문제</span></div></div>
    <button class="restart" id="restartBtn">다시 도전하기</button>
  </section>
</main>

    ['네 변의 길이가 모두 5cm인 사각형은 정사각형일 수도 있다.',true],
    ['네 변의 길이가 모두 5cm인 사각형은 반드시 직사각형이다.',false],
    ['네 각이 모두 90°인 사각형은 정사각형일 수도 있다.',true],
    ['네 각이 모두 90°인 사각형은 반드시 마름모이다.',false],
    ['평행사변형의 한 각이 60°이면 마주 보는 각도 60°이다.',true],
    ['평행사변형의 한 각이 60°이면 이웃한 각도 60°이다.',false],
    ['평행사변형의 한 각이 70°이면 이웃한 각은 110°이다.',true],
    ['마름모의 한 각이 120°이면 마주 보는 각도 120°이다.',true],
    ['마름모의 한 각이 120°이면 이웃한 각도 120°이다.',false],

    ['마름모를 돌려 놓으면 네 변의 길이가 달라진다.',false],
    ['사각형의 크기가 달라져도 정의에 맞으면 같은 종류의 사각형이다.',true],
    ['서로 다른 크기의 정사각형도 네 각의 크기는 모두 같다.',true],

    ['두 이웃한 변이 각각 4cm와 6cm인 직사각형은 정사각형이다.',false],
    ['네 각이 모두 직각인 평행사변형은 직사각형이다.',true],
    ['직사각형과 마름모의 성질을 모두 가진 사각형은 정사각형이다.',true],
    ['어떤 사각형이 사다리꼴이면서 평행사변형일 수도 있다.',true]
  ]}
];
const TARGET = 20;
const ALLOWED_MISTAKES = 1;
const FEEDBACK_DELAY_MS = 850;
const ALL_QUESTIONS = QUESTION_GROUPS.flatMap(group => group.items.map(([text,correct]) => ({text, correct, category:group.category})));
const $ = id => document.getElementById(id);
let queue = [], count = 0, mistakes = 0, locked = false, nextTimer = null;

function shuffle(items) {
  const result = [...items];
  for (let i=result.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function show(id) {
  ['home','game','result'].forEach(name => $(name).classList.toggle('hidden',name!==id));
}
function startGame() {
  if (nextTimer !== null) {clearTimeout(nextTimer);nextTimer=null;}
  queue=shuffle(ALL_QUESTIONS).slice(0,TARGET);
  count=0; mistakes=0; locked=false;
  show('game'); renderQuestion();
}
function renderQuestion() {
  locked=false;
  const q=queue[count];
  $('progressText').textContent=`${count+1} / ${TARGET}`;
  $('mistakeText').textContent=`남은 실수 기회 💛 ${ALLOWED_MISTAKES-mistakes}`;
  $('mistakeText').className=mistakes?'danger':'ok';
  $('meterFill').style.width=`${count/TARGET*100}%`;
  $('meter').setAttribute('aria-valuenow',String(count));
  $('category').textContent=q.category;
  $('question').textContent=q.text;
  $('feedback').textContent='';
  for (const id of ['oBtn','xBtn']) {$(id).disabled=false;$(id).classList.remove('selected');}
}
function answer(choice) {
  if (locked || count >= TARGET) return;
  locked=true;
  const q=queue[count];
  const isCorrect=choice===q.correct;
  if (!isCorrect) mistakes++;
  $('oBtn').disabled=true; $('xBtn').disabled=true;
  $(choice?'oBtn':'xBtn').classList.add('selected');
  $('feedback').replaceChildren();
  const main=document.createElement('div');
  main.textContent=isCorrect?'✅ 정답이에요!':mistakes===1?'💛 괜찮아요! 한 번 더 기회가 있어요.':'❌ 두 번째 오답이에요!';
  main.className=isCorrect?'ok':'danger';
  const sub=document.createElement('small');
  sub.textContent=`정답: ${q.correct?'O':'X'}`;
  $('feedback').append(main,sub);
  count++;
  $('meterFill').style.width=`${count/TARGET*100}%`;
  $('meter').setAttribute('aria-valuenow',String(count));
  $('mistakeText').textContent=`남은 실수 기회 💛 ${Math.max(0,ALLOWED_MISTAKES-mistakes)}`;
  nextTimer=setTimeout(()=>{
    nextTimer=null;
    if(mistakes>ALLOWED_MISTAKES) return finish(false);
    if(count>=TARGET) return finish(true);
    renderQuestion();
  },FEEDBACK_DELAY_MS);
}
function finish(success) {
  show('result');
  $('resultIcon').textContent=success?'🏆':'🌱';
  $('resultTitle').textContent=success?'20문항 도전 성공!':'아쉽지만 도전 실패!';
  $('resultDetail').textContent=success
    ? `20문항을 모두 풀었어요! 틀린 문제 ${mistakes}개. 정말 잘했어요!`
    : `두 번째 오답이 나왔어요. ${count}문항을 풀었어요. 다시 도전해 봐요!`;
  $('solvedStat').textContent=count;
  $('wrongStat').textContent=mistakes;
}
$('startBtn').addEventListener('click',startGame);
$('restartBtn').addEventListener('click',startGame);
$('oBtn').addEventListener('click',()=>answer(true));
$('xBtn').addEventListener('click',()=>answer(false));
// 배포 전 확인: 문항 수, 정답 형식, 중복 등을 검증합니다.
if(ALL_QUESTIONS.length!==150 || ALL_QUESTIONS.some(q=>typeof q.correct!=='boolean' || !q.text)) {
  console.error('문제은행을 확인하세요.',ALL_QUESTIONS.length);
}
</script>
